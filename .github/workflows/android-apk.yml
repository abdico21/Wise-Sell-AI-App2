name: Build WiseSell AI Android APK
on:
 workflow_dispatch:
 push:
  paths:
   - "app/**"
   - "*.gradle.kts"
   - "gradle.properties"
   - ".github/workflows/android-apk.yml"
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: "17"
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: "8.9"
   - name: Validate Firebase API key secret (without printing it)
     env:
      WISESELL_FIREBASE_API_KEY: ${{ secrets.WISESELL_FIREBASE_API_KEY }}
     run: |
      if [ -z "$WISESELL_FIREBASE_API_KEY" ]; then
        echo "::error::WISESELL_FIREBASE_API_KEY is missing or empty in GitHub Actions secrets."
        exit 1
      fi
      case "$WISESELL_FIREBASE_API_KEY" in
        AIza*) echo "Firebase API key secret is present and has the expected key prefix." ;;
        *) echo "::error::Firebase API key secret does not have the expected Google API key prefix. Use the Firebase Web API key, not an OAuth client ID or service-account key."; exit 1 ;;
      esac
   - name: Build debug APK
     env:
      WISESELL_FIREBASE_API_KEY: ${{ secrets.WISESELL_FIREBASE_API_KEY }}
     run: gradle --no-daemon assembleDebug -PWISESELL_FIREBASE_API_KEY="$WISESELL_FIREBASE_API_KEY"
   - uses: actions/upload-artifact@v4
     with:
      name: wisesell-ai-android-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
