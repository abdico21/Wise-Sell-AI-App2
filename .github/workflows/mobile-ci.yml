name: WiseSell Flutter Mobile CI

on:
  push:
    branches:
      - main
      - feature/flutter-mobile-foundation
      - fix/free-workers-ai-mobile-integration
  pull_request:
    branches:
      - main
      - feature/flutter-mobile-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wisesell-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality-and-android-build:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js for Cloudflare Worker
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare AI Worker
        working-directory: cloudflare
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffolding
        run: flutter create . --platforms=android --org=com.aistudio.wisesell --project-name=kpzqvm

      - name: Test secure Android signing configurator
        run: python3 scripts/test-android-signing-configurator.py

      - name: Generate WiseSell branded Android launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          for spec in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            folder="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "android/app/src/main/res/$folder"
            rsvg-convert -w "$size" -h "$size" assets/branding/wisesell_app_icon.svg > "android/app/src/main/res/$folder/ic_launcher.png"
          done

      - name: Configure Firebase Google Services plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings_kts = Path("android/settings.gradle.kts")
          app_kts = Path("android/app/build.gradle.kts")
          if settings_kts.exists() and app_kts.exists():
              settings = settings_kts
              app = app_kts
              plugin_line = '    id("com.google.gms.google-services") version "4.4.2" apply false'
              app_plugin = '    id("com.google.gms.google-services")'
          else:
              settings = Path("android/settings.gradle")
              app = Path("android/app/build.gradle")
              if not settings.exists() or not app.exists():
                  raise SystemExit("Android Gradle files were not generated.")
              plugin_line = '    id "com.google.gms.google-services" version "4.4.2" apply false'
              app_plugin = '    id "com.google.gms.google-services"'

          settings_text = settings.read_text()
          if "com.google.gms.google-services" not in settings_text:
              settings_text = settings_text.replace("plugins {", "plugins {\n" + plugin_line, 1)
              settings.write_text(settings_text)

          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              app_text = app_text.replace("plugins {", "plugins {\n" + app_plugin, 1)
              app.write_text(app_text)
          PY

      - name: Verify Firebase Android configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          assert config["project_info"]["project_id"] == "gen-lang-client-0645056984"
          assert config["client"][0]["client_info"]["android_client_info"]["package_name"] == "com.aistudio.wisesell.kpzqvm"
          print("Firebase configuration verified for com.aistudio.wisesell.kpzqvm")
          PY

      - name: Detect Android signing secrets
        id: android-signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          values=("$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD")
          present=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -eq 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Production signing secrets are not configured; signed release packaging will be skipped."
          elif [[ "$present" -eq 4 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "All required signing secret names are available."
          else
            echo "Signing secrets are only partially configured; refusing to build a misleading release artifact." >&2
            exit 1
          fi

      - name: Configure secure Android release signing
        if: steps.android-signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/configure-android-signing.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build CI validation APK
        run: flutter build apk --release --dart-define=WISESELL_API_BASE_URL=https://wisesell-ai-api.iamabdu3.workers.dev

      - name: Verify production APK signature
        if: steps.android-signing.outputs.enabled == 'true'
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Build signed Google Play App Bundle
        if: steps.android-signing.outputs.enabled == 'true'
        run: flutter build appbundle --release --dart-define=WISESELL_API_BASE_URL=https://wisesell-ai-api.iamabdu3.workers.dev

      - name: Verify signed App Bundle
        if: steps.android-signing.outputs.enabled == 'true'
        run: |
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab

      - name: Upload CI validation APK
        uses: actions/upload-artifact@v4
        with:
          name: wisesell-ai-android-ci-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Google Play AAB
        if: steps.android-signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wisesell-ai-android-signed-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
