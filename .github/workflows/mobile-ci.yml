name: WiseSell Flutter Mobile CI

on:
  push:
    branches:
      - main
      - feature/flutter-mobile-foundation
  pull_request:
    branches:
      - main
      - feature/flutter-mobile-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wisesell-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality-and-android-build:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffolding
        run: flutter create . --platforms=android --org=com.aistudio.wisesell --project-name=kpzqvm

      - name: Generate WiseSell branded Android launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          for spec in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            folder="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "android/app/src/main/res/$folder"
            rsvg-convert -w "$size" -h "$size" assets/branding/wisesell_app_icon.svg > "android/app/src/main/res/$folder/ic_launcher.png"
          done

      - name: Configure Firebase Google Services plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings_kts = Path("android/settings.gradle.kts")
          app_kts = Path("android/app/build.gradle.kts")
          if settings_kts.exists() and app_kts.exists():
              settings = settings_kts
              app = app_kts
              plugin_line = '    id("com.google.gms.google-services") version "4.4.2" apply false'
              app_plugin = '    id("com.google.gms.google-services")'
          else:
              settings = Path("android/settings.gradle")
              app = Path("android/app/build.gradle")
              if not settings.exists() or not app.exists():
                  raise SystemExit("Android Gradle files were not generated.")
              plugin_line = '    id "com.google.gms.google-services" version "4.4.2" apply false'
              app_plugin = '    id "com.google.gms.google-services"'

          settings_text = settings.read_text()
          if "com.google.gms.google-services" not in settings_text:
              settings_text = settings_text.replace("plugins {", "plugins {\n" + plugin_line, 1)
              settings.write_text(settings_text)

          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              app_text = app_text.replace("plugins {", "plugins {\n" + app_plugin, 1)
              app.write_text(app_text)
          PY

      - name: Verify Firebase Android configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          assert config["project_info"]["project_id"] == "gen-lang-client-0645056984"
          assert config["client"][0]["client_info"]["android_client_info"]["package_name"] == "com.aistudio.wisesell.kpzqvm"
          print("Firebase configuration verified for com.aistudio.wisesell.kpzqvm")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: wisesell-ai-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
