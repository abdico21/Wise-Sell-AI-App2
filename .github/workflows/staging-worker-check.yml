name: WiseSell staging worker checks

on:
  push:
    branches:
      - staging/wisesell-social-commerce
    paths:
      - 'src/index.js'
      - 'src/payments/**'
      - 'docs/PAYMENTS_PROVIDER_ARCHITECTURE.md'
      - '.github/workflows/staging-worker-check.yml'
  pull_request:
    branches:
      - staging/wisesell-social-commerce

jobs:
  worker-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker JavaScript syntax
        run: node --check src/index.js
      - name: Check payment registry syntax
        run: node --check src/payments/provider-registry.js
