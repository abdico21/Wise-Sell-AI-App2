name = "wise-sell-ai-app2"
main = "src/index.js"
compatibility_date = "2026-11-14"

# Default environment remains on the existing zero-API fallback.
[vars]
APP_NAME = "Wise Sell AI"
FIREBASE_PROJECT_ID = "gen-lang-client-0645056984"
AI_PROVIDER = "fallback"

# Live inference is enabled only when explicitly deploying --env staging.
[env.staging]
name = "wise-sell-ai-app2-staging"

[env.staging.vars]
APP_NAME = "Wise Sell AI (Staging)"
FIREBASE_PROJECT_ID = "gen-lang-client-0645056984"
AI_PROVIDER = "workers-ai"
WORKERS_AI_MODEL = "@cf/zai-org/glm-4.7-flash"

[env.staging.ai]
binding = "AI"
